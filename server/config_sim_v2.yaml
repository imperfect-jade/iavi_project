data:
  train: sim_data_large/datasets/train.npz
  val: sim_data_large/datasets/val.npz
model:
  version: v2
  point_count: 2048
  action_count: 24
  center_mm: [0.0, 0.0, 50.0]
  scale_mm: 100.0
  use_points: true
training:
  batch_size: 128
  max_epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stop_patience: 15
  seed: 42
runtime:
  device: cuda:0
  num_workers: 2
  output_dir: runs/large_v2_pointnet_seed42_24
