data:
  train: sim_data/datasets/train.npz
  val: sim_data/datasets/val.npz
model:
  point_count: 2048
  action_count: 24
  center_mm: [0.0, 0.0, 50.0]
  scale_mm: 100.0
training:
  batch_size: 16
  max_epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stop_patience: 15
  seed: 42
runtime:
  device: cuda:0
  num_workers: 2
  output_dir: runs/sim_seed42_24
