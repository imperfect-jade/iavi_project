data:
  train: smoke_data/train.npz
  val: smoke_data/val.npz
model:
  point_count: 2048
  action_count: 36
  center_mm: [0.0, 0.0, 0.0]
  scale_mm: 100.0
training:
  batch_size: 16
  max_epochs: 2
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stop_patience: 2
  seed: 42
runtime:
  device: cuda:0
  num_workers: 0
  output_dir: runs/smoke
